<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FireGate 동기화 구조</title>
  <desc id="desc">FireGate, InfinityStock 사이트, 한국투자증권, 대시보드와 거래이력 사이의 동기화 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edfdf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .sub { font: 500 16px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .head { font: 800 23px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 500 15px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 600 13px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .accent { fill: #ecfeff; stroke: #99f6e4; stroke-width: 1.5; rx: 14; }
      .line { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line2 { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow2); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="60" y="72" class="title">FireGate 연동과 해석</text>
  <text x="60" y="104" class="sub">FireGate는 무한매수 포트폴리오 기준 정보, 사이트는 주문/잔고/이력 검증과 대시보드 표시를 담당합니다.</text>

  <g transform="translate(80 200)">
    <rect class="card" width="280" height="210"/>
    <text x="28" y="48" class="head">FireGate</text>
    <text x="28" y="82" class="body">무한매수 포트폴리오</text>
    <text x="28" y="108" class="body">시드, 회차, 목표수익률</text>
    <text x="28" y="134" class="body">수동 매수/매도 기록</text>
    <rect x="28" y="160" width="196" height="34" class="accent"/>
    <text x="44" y="182" class="small">포트폴리오 생성/해석</text>
  </g>

  <g transform="translate(500 160)">
    <rect class="card" width="280" height="290"/>
    <text x="28" y="48" class="head">InfinityStock 사이트</text>
    <text x="28" y="82" class="body">FireGate 연결 저장</text>
    <text x="28" y="108" class="body">관심종목/사이클 반영</text>
    <text x="28" y="134" class="body">LOC 예약 재시도</text>
    <text x="28" y="160" class="body">수익/평가액 계산</text>
    <rect x="28" y="196" width="214" height="34" class="accent"/>
    <text x="44" y="218" class="small">도구 &gt; 동기화</text>
    <rect x="28" y="240" width="214" height="34" class="accent"/>
    <text x="44" y="262" class="small">무한매수 매매 ON/OFF</text>
  </g>

  <g transform="translate(920 200)">
    <rect class="card" width="280" height="210"/>
    <text x="28" y="48" class="head">한국투자증권</text>
    <text x="28" y="82" class="body">주문 가능 금액</text>
    <text x="28" y="108" class="body">보유 수량/평가액</text>
    <text x="28" y="134" class="body">체결/주문 내역</text>
    <rect x="28" y="160" width="178" height="34" class="accent"/>
    <text x="44" y="182" class="small">KIS Open API</text>
  </g>

  <path class="line" d="M368 266 C420 238 448 232 492 238"/>
  <text x="390" y="226" class="small">Pull: FireGate 기준값</text>
  <path class="line dash" d="M492 372 C440 396 414 396 368 350"/>
  <text x="375" y="424" class="small">Push: 사이트 생성 포트폴리오/거래</text>

  <path class="line2" d="M788 265 C846 236 872 232 912 238"/>
  <text x="812" y="226" class="small">잔고/체결/주문 조회</text>
  <path class="line2 dash" d="M912 350 C856 390 834 390 788 372"/>
  <text x="820" y="424" class="small">LOC 주문/예약 결과</text>

  <g transform="translate(260 515)">
    <rect width="760" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="30" class="head">표시 위치</text>
    <text x="28" y="54" class="body">대시보드: 현재 상태와 예약 여부 · 거래이력: 단타거래, 사이클, 매매로그 · 무한매수: FireGate 화면과 수동 동기화</text>
  </g>
</svg>
