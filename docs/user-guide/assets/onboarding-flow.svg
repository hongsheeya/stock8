<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">InfinityStock 사용자 온보딩 흐름</title>
  <desc id="desc">회원가입부터 한국투자증권 API 저장, 해외 ETF 교육, FireGate 연동, 무한매수 운영까지의 단계별 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f9f7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .sub { font: 500 16px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .step { font: 800 15px Arial, sans-serif; fill: #2563eb; letter-spacing: 0; }
      .head { font: 800 21px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 500 14px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 500 12px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .pill { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 13; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .icon { fill: url(#primary); }
    </style>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <text x="60" y="72" class="title">InfinityStock 이용 시작 흐름</text>
  <text x="60" y="104" class="sub">처음 쓰는 사용자는 아래 순서대로 준비하면 대시보드에서 무한매수 상태를 확인할 수 있습니다.</text>

  <g transform="translate(60 160)">
    <rect class="card" width="205" height="210"/>
    <circle cx="40" cy="40" r="22" class="icon"/>
    <text x="28" y="46" font-family="Arial" font-size="19" font-weight="800" fill="#fff">1</text>
    <text x="28" y="84" class="step">회원가입</text>
    <text x="28" y="118" class="head">사이트 계정 생성</text>
    <text x="28" y="150" class="body">이름, 휴대폰, 이메일,</text>
    <text x="28" y="172" class="body">비밀번호를 입력합니다.</text>
    <rect x="28" y="186" width="106" height="26" class="pill"/>
    <text x="43" y="204" class="small">/access</text>
  </g>

  <path class="line" d="M282 265 H360"/>

  <g transform="translate(380 160)">
    <rect class="card" width="205" height="210"/>
    <circle cx="40" cy="40" r="22" class="icon"/>
    <text x="28" y="46" font-family="Arial" font-size="19" font-weight="800" fill="#fff">2</text>
    <text x="28" y="84" class="step">KIS API</text>
    <text x="28" y="118" class="head">앱키 발급/저장</text>
    <text x="28" y="150" class="body">한국투자증권에서</text>
    <text x="28" y="172" class="body">App Key/Secret 발급</text>
    <rect x="28" y="186" width="138" height="26" class="pill"/>
    <text x="43" y="204" class="small">설정 &gt; API</text>
  </g>

  <path class="line" d="M602 265 H680"/>

  <g transform="translate(700 160)">
    <rect class="card" width="205" height="210"/>
    <circle cx="40" cy="40" r="22" class="icon"/>
    <text x="28" y="46" font-family="Arial" font-size="19" font-weight="800" fill="#fff">3</text>
    <text x="28" y="84" class="step">ETF 교육</text>
    <text x="28" y="118" class="head">레버리지 교육</text>
    <text x="28" y="150" class="body">SOXL/TQQQ 등은</text>
    <text x="28" y="172" class="body">교육 이수번호 등록</text>
    <rect x="28" y="186" width="116" height="26" class="pill"/>
    <text x="43" y="204" class="small">KIFIN/KIS</text>
  </g>

  <path class="line" d="M922 265 H1000"/>

  <g transform="translate(1020 160)">
    <rect class="card" width="205" height="210"/>
    <circle cx="40" cy="40" r="22" class="icon"/>
    <text x="28" y="46" font-family="Arial" font-size="19" font-weight="800" fill="#fff">4</text>
    <text x="28" y="84" class="step">FireGate</text>
    <text x="28" y="118" class="head">계정 연결</text>
    <text x="28" y="150" class="body">FireGate 포트폴리오와</text>
    <text x="28" y="172" class="body">무한매수 사이클 동기화</text>
    <rect x="28" y="186" width="148" height="26" class="pill"/>
    <text x="43" y="204" class="small">/infinite-buy</text>
  </g>

  <g transform="translate(155 430)">
    <rect width="970" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="30" class="head">운영 루틴</text>
    <text x="28" y="54" class="body">대시보드에서 총자산, 매수 가능액, 무한매수 ON/OFF, LOC 예약 상태, 거래 이력을 매일 확인합니다.</text>
    <path class="line" d="M700 36 H880"/>
    <text x="896" y="42" class="step">대시보드 / 거래이력</text>
  </g>
</svg>
