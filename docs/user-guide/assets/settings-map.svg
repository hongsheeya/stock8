<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">설정 화면 지도</title>
  <desc id="desc">InfinityStock 설정 화면의 API, 관심종목, 파라미터, 매도 전략, 단타 인증 탭 설명</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f1f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .sub { font: 500 16px Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .head { font: 800 22px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 500 15px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .tag { font: 800 12px Arial, sans-serif; fill: #1d4ed8; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 12; }
      .warn { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1; rx: 12; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="60" y="72" class="title">설정 화면 사용 지도</text>
  <text x="60" y="104" class="sub">설정은 증권사 API 저장, 무한매수 기준값, 수수료, LOC 매매 방식, 단타 인증을 나누어 관리합니다.</text>

  <g transform="translate(70 165)">
    <rect class="card" width="350" height="190"/>
    <rect x="26" y="24" width="76" height="24" class="badge"/>
    <text x="43" y="41" class="tag">API</text>
    <text x="26" y="78" class="head">증권사 / 계정</text>
    <text x="26" y="112" class="body">한국투자증권 또는 토스증권 선택</text>
    <text x="26" y="138" class="body">증권사 API Key, 계좌번호</text>
    <text x="26" y="164" class="body">모의/실전 선택, 연결 테스트</text>
  </g>

  <g transform="translate(465 165)">
    <rect class="card" width="350" height="190"/>
    <rect x="26" y="24" width="112" height="24" class="badge"/>
    <text x="43" y="41" class="tag">관심종목</text>
    <text x="26" y="78" class="head">무한매수 종목</text>
    <text x="26" y="112" class="body">종목, 거래소, 투자금 USD</text>
    <text x="26" y="138" class="body">분할 회차, 목표수익률</text>
    <text x="26" y="164" class="body">자동/확인/수동 모드</text>
  </g>

  <g transform="translate(860 165)">
    <rect class="card" width="350" height="190"/>
    <rect x="26" y="24" width="112" height="24" class="badge"/>
    <text x="43" y="41" class="tag">파라미터</text>
    <text x="26" y="78" class="head">기본값/비용</text>
    <text x="26" y="112" class="body">기본 분할 수, 목표수익률</text>
    <text x="26" y="138" class="body">매수/매도 수수료, 세금</text>
    <text x="26" y="164" class="body">무한매수 자동매매 ON/OFF</text>
  </g>

  <g transform="translate(260 405)">
    <rect class="card" width="350" height="210"/>
    <rect x="26" y="24" width="112" height="24" class="badge"/>
    <text x="43" y="41" class="tag">매도전략</text>
    <text x="26" y="78" class="head">LOC / FireGate 기준</text>
    <text x="26" y="112" class="body">시장가 또는 LOC 매도 방식</text>
    <text x="26" y="138" class="body">FireGate Default, 전량, 분할</text>
    <text x="26" y="164" class="body">폭락 매수 옵션</text>
    <text x="26" y="190" class="body">17:40 KST LOC 자동 예약</text>
  </g>

  <g transform="translate(670 405)">
    <rect class="card" width="350" height="210"/>
    <rect x="26" y="24" width="112" height="24" class="warn"/>
    <text x="43" y="41" class="tag" fill="#c2410c">단타 인증</text>
    <text x="26" y="78" class="head">관리자 전용</text>
    <text x="26" y="112" class="body">일반 사용자에게 기본 숨김</text>
    <text x="26" y="138" class="body">관리자 전역 ON 후 사용자 인증</text>
    <text x="26" y="164" class="body">사용자는 확인 문구 입력 필요</text>
    <text x="26" y="190" class="body">인증 전 자동매매/수동매도 차단</text>
  </g>
</svg>
